<nav class="sidebar" [class.open]="isSidebarOpen">
  
  <ul>
    <li *ngFor="let item of filteredSidebarItems">
      <a [routerLink]="item.route" routerLinkActive="active">
        <mat-icon>{{item.icon}}</mat-icon>
        <span class="menu-label">{{item.label}}</span>
      </a>
    </li>
  </ul>
</nav>
