<!-- 
  =============================================
  TABLEAU DE BORD ADMINISTRATEUR 
  =============================================
-->
<div *ngIf="isAdmin()">
  <div class="admin-dashboard">

    <!-- Section Statistiques Utilisateurs -->
    <div class="stats-section">
      <h2><mat-icon>people</mat-icon> Statistiques Utilisateurs</h2>

      <!-- Cartes de statistiques utilisateur -->
      <div class="stats-grid">
        <div class="stat-card" *ngFor="let stat of userStats" (click)="navigateToUserList(stat.route)">
          <div class="stat-icon" [ngClass]="stat.label.toLowerCase()">
            <mat-icon>{{ stat.icon }}</mat-icon>
          </div>
          <div class="stat-content">
            <span class="stat-label">{{ stat.label }}</span>
            <div class="stat-value">{{ stat.value }}</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>


<!-- 
  =============================================
  TABLEAU DE BORD SUPERVISEUR 
  =============================================
-->
<div *ngIf="isSupervisor()">
  <div class="dashboard-container">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">
            <i class="material-icons">groups</i>
          </div>
          <div class="stat-content">
             <h3>{{ nbClasses }}</h3>
            <p>Classes actives</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon success">
            <i class="material-icons">people</i>
          </div>
          <div class="stat-content">
            <h3>{{ nbApprenants }}</h3>
            <p>Apprenants totaux</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon warning">
            <i class="material-icons">school</i>
          </div>
          <div class="stat-content">
            <h3>{{ nbFormateurs }}</h3>
            <p>Formateurs actifs</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon info">
            <i class="material-icons">trending_up</i>
          </div>
          <div class="stat-content">
            <h3>{{ nbreussite }} %</h3>
            <p>Taux de réussite global</p>
          </div>
        </div>
      </div>
    </div>
</div>
