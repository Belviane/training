<div *ngIf="isAdmin()">
  <div class="admin-dashboard">
    <h1>Tableau de bord administrateur</h1>
    <div class="row">
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5>Comptes</h5>
            <p>Gestion des comptes utilisateurs</p>
            <button class="btn btn-primary" (click)="navigateTo('comptes')">Gérer les comptes</button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5>Contenus</h5>
            <p>Gestion des contenus de la plateforme</p>
            <button class="btn btn-primary" (click)="navigateTo('contenus')">Gérer les contenus</button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5>Statistiques</h5>
            <p>Voir les statistiques de la plateforme</p>
            <button class="btn btn-primary" (click)="navigateTo('statistiques')">Voir les statistiques</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
