<!-- examen-list.component.html -->
<div *ngIf="isLoading" class="text-center">
  <div class="spinner-border" role="status">
    <span class="sr-only">Chargement...</span>
  </div>
</div>

<div *ngIf="error" class="alert alert-danger">{{ error }}</div>

<div class="list-group">
  <a *ngFor="let examen of examens" 
     [routerLink]="['/examens', examen.id]" 
     class="list-group-item list-group-item-action flex-column align-items-start">
    <div class="d-flex w-100 justify-content-between">
      <h5 class="mb-1">{{ examen.titre }}</h5>
      <small [ngClass]="{'text-danger': examen.est_archive}">
        {{ examen.est_archive ? 'Archivé' : 'Actif' }}
      </small>
    </div>
    <p class="mb-1">{{ examen.description }}</p>
    <small>Durée: {{ examen.duree }} minutes</small>
  </a>
</div>

<button *ngIf="examens.length === 0 && !isLoading" class="btn btn-primary mt-3">
  Créer un nouvel examen
</button>
