<!-- tentative-examen.component.html -->
<div *ngIf="!examen" class="text-center">
  <div class="spinner-border" role="status">
    <span class="sr-only">Chargement...</span>
  </div>
</div>

<div *ngIf="examen" class="exam-container">
  <div class="exam-header">
    <h2>{{ examen.titre }}</h2>
    <div class="time-remaining" [ngClass]="{'text-danger': tempsRestant?.includes('0m')}">
      Temps restant: {{ tempsRestant || 'Chargement...' }}
    </div>
  </div>

  <p>{{ examen.description }}</p>

  <div *ngFor="let question of examen.questions; let i = index" class="question-card">
    <h5>Question {{ i + 1 }}</h5>
    <p>{{ question.enonce }}</p>
    
    <div *ngIf="question.type === 'choix_multiple'" class="options-container">
      <div *ngFor="let option of question.options" class="form-check">
        <input class="form-check-input" type="checkbox" 
               [id]="'q'+question.id+'-'+option"
               [checked]="reponses[question.id]?.includes(option)"
               (change)="onOptionChange(question.id, option, $event.target.checked)">
        <label class="form-check-label" [for]="'q'+question.id+'-'+option">
          {{ option }}
        </label>
      </div>
    </div>

    <div *ngIf="question.type === 'texte_libre'" class="form-group">
      <textarea class="form-control" rows="3"
                [(ngModel)]="reponses[question.id]"
                [ngModelOptions]="{standalone: true}"></textarea>
    </div>

    <div *ngIf="question.type === 'vrai_faux'" class="form-check">
      <div class="form-check">
        <input class="form-check-input" type="radio" 
               [name]="'q'+question.id"
               id="true" value="true"
               [(ngModel)]="reponses[question.id]">
        <label class="form-check-label" for="true">Vrai</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" 
               [name]="'q'+question.id"
               id="false" value="false"
               [(ngModel)]="reponses[question.id]">
        <label class="form-check-label" for="false">Faux</label>
      </div>
    </div>
  </div>

  <button (click)="submitTentative()" class="btn btn-primary" [disabled]="isSubmitting">
    <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm" role="status"></span>
    Soumettre l'examen
  </button>
</div>
