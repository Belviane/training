<!-- examen-form.component.html -->
<form [formGroup]="examenForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label>Titre *</label>
    <input type="text" formControlName="titre" class="form-control">
    <div *ngIf="examenForm.get('titre').invalid && examenForm.get('titre').touched" class="text-danger">
      Le titre est obligatoire
    </div>
  </div>

  <div class="form-group">
    <label>Description</label>
    <textarea formControlName="description" class="form-control" rows="3"></textarea>
  </div>

  <div class="form-row">
    <div class="form-group col-md-6">
      <label>Durée (minutes) *</label>
      <input type="number" formControlName="duree" class="form-control" min="1">
      <div *ngIf="examenForm.get('duree').invalid && examenForm.get('duree').touched" class="text-danger">
        Durée invalide (minimum 1 minute)
      </div>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group col-md-6">
      <label>Date d'ouverture *</label>
      <input type="datetime-local" formControlName="date_ouverture" class="form-control">
    </div>
    <div class="form-group col-md-6">
      <label>Date de fermeture *</label>
      <input type="datetime-local" formControlName="date_fermeture" class="form-control">
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
    <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    {{ examen ? 'Mettre à jour' : 'Créer' }}
  </button>
</form>
