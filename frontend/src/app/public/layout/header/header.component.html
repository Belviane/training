<header class="site-header">
  <nav id="navbar" [ngClass]="{'scrolled': isScrolled}">
    <div class="container">
      <!-- Logo + Nom -->
      <div class="logo-section">
        <img src="assets/logo.jpg" alt="Logo" class="logo-img" />
        <div class="site-title">
          <span class="site-name">BE I.T AFRICA</span>
        </div>
      </div>

      <!-- Menu principal -->
      <ul #mainMenu class="main-menu" [class.open]="menuOpen">
        <li>
          <a routerLink="/" 
             [class.active]="activeLink === 'accueil'" 
             (click)="navigateTo('/')">
            <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"></mat-icon>
            <span>Accueil</span>
          </a>
        </li>
        <li>
          <a routerLink="/formations" 
             [class.active]="activeLink === 'formations'" 
             (click)="navigateTo('/formations')">
            <mat-icon>school</mat-icon>
            <span>Formations</span>
          </a>
        </li>
        <li>
          <a routerLink="/about" 
             [class.active]="activeLink === 'about'" 
             (click)="navigateTo('/about')">
            <mat-icon>info</mat-icon>
            <span>À Propos</span>
          </a>
        </li>
        <li>
          <a routerLink="/contact" 
             [class.active]="activeLink === 'contact'" 
             (click)="navigateTo('/contact')">
            <mat-icon>mail</mat-icon>
            <span>Contact</span>
          </a>
        </li>
      </ul>

      <!-- Actions -->
      <div class="header-actions">
        <a href="/register" class="btn btn-outline">Inscription</a>
        <a href="/login" class="btn btn-primary">Connexion</a>
      </div>

      <!-- Menu hamburger pour mobile -->
      <button #menuToggle class="menu-toggle" (click)="toggleMenu()" [class.active]="menuOpen" aria-label="Menu" aria-expanded="false" [attr.aria-expanded]="menuOpen">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>
</header>
