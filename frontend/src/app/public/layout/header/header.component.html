<header class="site-header">
  <nav id="navbar" [class.scrolled]="isScrolled">
    <div class="container">
      <!-- Logo + Nom -->
      <div class="logo-section">
        <img src="assets/logo.jpg" alt="Logo" class="logo-img" />
        <div class="site-title">
          <span class="site-name">BE I.T.</span>
          <span class="site-subtitle">AFRICA</span>
        </div>
      </div>

      <!-- Menu hamburger pour mobile -->
      <button class="menu-toggle" (click)="toggleMenu()" [class.active]="menuOpen">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Menu principal -->
      <ul class="main-menu" [class.open]="menuOpen">
  <li>
    <a routerLink="/" 
       [class.active]="activeLink === 'accueil'" 
       (click)="navigateTo('/')">
      <i class="fi fi-sr-home"></i>
      <span>Accueil</span>
    </a>
  </li>
  <li>
    <a routerLink="/formations" 
       [class.active]="activeLink === 'formations'" 
       (click)="navigateTo('/formations')">
      <i class="fi fi-sr-graduation-cap"></i>
      <span>Formations</span>
    </a>
  </li>
  <li>
    <a routerLink="/about" 
       [class.active]="activeLink === 'about'" 
       (click)="navigateTo('/about')">
      <i class="fi fi-sr-info"></i>
      <span>À Propos</span>
    </a>
  </li>
  <li>
    <a routerLink="/contact" 
       [class.active]="activeLink === 'contact'" 
       (click)="navigateTo('/contact')">
      <i class="fi fi-sr-envelope"></i>
      <span>Contact</span>
    </a>
  </li>
</ul>

      <!-- Actions -->
      <div class="header-actions">
        <a href="/register" class="btn btn-outline">Inscription</a>
        <a href="/login" class="btn btn-primary">Connexion</a>
      </div>
    </div>
  </nav>
</header>
