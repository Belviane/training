<main>
  <div class="login-container">
    <div class="login-header">
      <img src="assets/logo.png" alt="Logo BE I.T. CLASSROOM" class="logo" />
      <h2>BE I.T. CLASSROOM</h2>
      <p class="subtitle">Connectez-vous à votre espace</p>
    </div>

    <form class="login-form" (submit)="Login()">
      <div class="form-group">
        <label for="login">Login</label>
        <div class="input-wrapper">
          <input
            type="login"
            id="login"
            name="login"
            placeholder="Entrez votre login"
            autocomplete="login"
            required
            aria-required="true"
          />
        </div>
      </div>
      <input type="text" id="username" name="username" autocomplete="username" style="display: none;" />
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Entrez votre mot de passe"
            autocomplete="current-password"
            required
            aria-required="true"
          />
        </div>
      </div>

      <button type="submit" class="login-btn">Se connecter</button>
      <div class="login-footer">
        <a href="##" class="forgot-password">Mot de passe oublié ?</a>
      </div>
    </form>
  </div>

  <footer class="auth-footer">
    <p>&copy; {{ currentYear }} BE IT AFRICA. Tous droits réservés.</p>
  </footer>
</main>
