<main>
  <div class="login-container">
    <div class="login-header">
      <img src="assets/logo.png" alt="Logo BE I.T. CLASSROOM" class="logo" />
      <h2>BE I.T. CLASSROOM</h2>
      <p class="subtitle">Connectez-vous à votre espace</p>
    </div>

    <form class="login-form" (submit)="login()">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Entrez votre email"
            autocomplete="email"
            required
            aria-required="true"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Entrez votre mot de passe"
            autocomplete="current-password"
            required
            aria-required="true"
          />
          <button type="button" class="toggle-password" aria-label="Afficher ou masquer le mot de passe">👁️</button>
        </div>
      </div>

      <button type="submit" class="login-btn">Se connecter</button>

      <div class="login-footer">
        <a href="##" class="forgot-password">Mot de passe oublié ?</a>
      </div>
    </form>
  </div>

  <footer class="auth-footer">
    <p>&copy; {{ currentYear }} BE IT AFRICA. Tous droits réservés.</p>
  </footer>
</main>
