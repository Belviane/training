<div class="form-container">
  <h2 mat-dialog-title>{{ data.user ? 'Modifier' : 'Créer' }} un utilisateur</h2>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" mat-dialog-content>
    <div class="form-grid">
      <!-- Rôle -->
      <mat-form-field appearance="outline">
        <mat-label>Rôle</mat-label>
        <mat-select formControlName="role_id" required>
          <mat-option *ngFor="let role of rolesList" [value]="role.id">
            {{ role.label }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="userForm.get('role_id')?.hasError('required')">
          Ce champ est obligatoire
        </mat-error>
      </mat-form-field>

      <!-- Nom -->
      <mat-form-field appearance="outline">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="nom" required />
        <mat-error *ngIf="userForm.get('nom')?.hasError('required')">
          Ce champ est obligatoire
        </mat-error>
      </mat-form-field>

      <!-- Prénom -->
      <mat-form-field appearance="outline">
        <mat-label>Prénom</mat-label>
        <input matInput formControlName="prenom" required />
        <mat-error *ngIf="userForm.get('prenom')?.hasError('required')">
          Ce champ est obligatoire
        </mat-error>
      </mat-form-field>

      <!-- Genre -->
      <mat-form-field appearance="outline">
        <mat-label>Genre</mat-label>
        <mat-select formControlName="genre" required>
          <mat-option value="Masculin">Masculin</mat-option>
          <mat-option value="Feminin">Féminin</mat-option>
        </mat-select>
        <mat-error *ngIf="userForm.get('genre')?.hasError('required')">
          Ce champ est obligatoire
        </mat-error>
      </mat-form-field>

      <!-- Date de naissance -->
      <mat-form-field appearance="outline">
        <mat-label>Date de naissance</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date_naissance" required />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="userForm.get('date_naissance')?.hasError('required')">
          Ce champ est obligatoire
        </mat-error>
      </mat-form-field>

      <!-- Email -->
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" required />
        <mat-error *ngIf="userForm.get('email')?.hasError('required')">
          Ce champ est obligatoire
        </mat-error>
        <mat-error *ngIf="userForm.get('email')?.hasError('email')">
          Email invalide
        </mat-error>
      </mat-form-field>
    </div>

    <div mat-dialog-actions align="end">
      <button mat-button (click)="onCancel()">Annuler</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid || isLoading">
        <span *ngIf="!isLoading">{{ data.user ? 'Modifier' : 'Créer' }}</span>
        <mat-spinner *ngIf="isLoading" diameter="24"></mat-spinner>
      </button>
    </div>
  </form>
</div>
