<div class="not-found-container">
  <div class="error-illustration">
    <img src="assets/images/notfound.jpg" alt="Étudiant confus devant un tableau vide">
  </div>
  <div class="error-content">
    <h2 class="error-title">Page non trouvée</h2>
    <p class="error-message">
      Oups ! On dirait que vous vous êtes perdu dans les couloirs.
    </p>
    <div class="error-actions">
      <button mat-raised-button color="primary" routerLink="/app" class="action-button">
        <mat-icon>home</mat-icon>
        Retour à l'accueil
      </button>
      <button mat-stroked-button color="primary" routerLink="" class="action-button">
        <mat-icon>help</mat-icon>
        Demander de l'aide
      </button>
    </div>
  </div>
</div>
