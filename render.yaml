services:
  - type: web
    name: laravel-backend
    env: php
    plan: free
    buildCommand: |
      cd backend
      composer install --no-dev --optimize-autoloader
      php artisan key:generate
      php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    autoDeploy: true
    repo: https://gitlab.com/Belviane1/training.git
    rootDir: backend
    region: oregon
    envVars:
      # APP
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://beitclassroom.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://beitclassroom.netlify.app

      # CORS / SESSION / SANCTUM
      - key: CORS_ALLOWED_ORIGINS
        value: https://beitclassroom.netlify.app
      - key: SESSION_DOMAIN
        value: beitclassroom.netlify.app
      - key: SANCTUM_STATEFUL_DOMAINS
        value: beitclassroom.netlify.app

      # DB
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: database  
          name: mysql
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: training
      - key: DB_USERNAME
        value: laravel_user
      - key: DB_PASSWORD
        generateValue: true

      # MAIL
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: alineonana070@gmail.com
      - key: MAIL_FROM_NAME
        value: Laravel
      - key: MAIL_USERNAME
        value: alineonana070@gmail.com
      - key: MAIL_PASSWORD
        value: uyywspqzhokesnuo

databases:
  - name: mysql
    databaseName: training
    user: laravel_user
    plan: free
